[package]
name = "mmap_bidiff"
version = "0.1.0"
edition = "2024"
authors = ["oetyng@gmail.com"]
description = "Zero-copy binary diffing and patching using memory-mapped files."
license = "MIT OR Apache-2.0"
repository = "https://github.com/oetyng/mmap_bidiff"
keywords = ["binary-diff", "patching", "mmap", "zero-copy", "rust"]
categories = ["compression", "filesystem", "data-structures"]

[features]
default = ["enc"]
enc = ["byteorder", "integer-encoding"]
instructions = []
profiling = []

[dependencies]
memmap2 = "0.9.5"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "1.0.23"

# for top
hex = "0.4.3"
md5 = "0.7.0"
zstd = "0.13.3"
num_cpus = "1.16.0"
rmp-serde = "1.3.0"

# for under
byteorder = { version = "1.5.0", optional = true }
integer-encoding = { version = "4.0.2", optional = true, default-features = false }
log = "0.4.17"
sacabase = "2.0.0"
sacapart = "2.0.0"
divsufsort = "2.0.0"
rayon = "1.6.1"

[dev-dependencies]
proptest = "1.0.0"
tempfile = "3.19.1"